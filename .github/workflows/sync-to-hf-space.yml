name: Sync To Hugging Face Space

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync-to-space:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare Space bundle
        run: |
          mkdir -p .hf-space-build/backend
          mkdir -p .hf-space-build/models/final

          cp -r backend/app .hf-space-build/backend/app
          cp backend/requirements.txt .hf-space-build/requirements.txt
          cp deploy/hf-space/Dockerfile .hf-space-build/Dockerfile
          cp deploy/hf-space/README.md .hf-space-build/README.md
          cp models/final/agrismart_model_final.tflite .hf-space-build/models/final/agrismart_model_final.tflite
          cp models/final/model_metadata.json .hf-space-build/models/final/model_metadata.json

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_XET_HIGH_PERFORMANCE: 1
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN is missing"
            exit 1
          fi
          python -m pip install --upgrade "huggingface_hub"
          python <<'PY'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          api.upload_folder(
              folder_path=".hf-space-build",
              repo_id="Juniorleriche/agrismart-api",
              repo_type="space",
              commit_message="Sync from GitHub",
          )
          print("Space sync completed")
          PY
